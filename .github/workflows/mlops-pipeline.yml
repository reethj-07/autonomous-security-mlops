name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r training/requirements.txt
          pip install mlflow scikit-learn pandas pyarrow dvc

      # 🔑 AUTH FOR DAGSHUB DVC
      - name: Configure DVC remote auth
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user ${{ secrets.DAGSHUB_USER }}
          dvc remote modify --local dagshub password ${{ secrets.DAGSHUB_TOKEN }}

      # 🔑 PULL DATA
      - name: Pull feature data from DVC
        run: |
          dvc pull

      - name: Run training
        run: |
          python training/train.py

      - name: Register model
        run: |
          python training/register_model.py

      - name: Promotion gate
        run: |
          python training/promote_model.py
