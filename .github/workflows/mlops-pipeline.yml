name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  # =====================================================
  # 1️⃣ TRAINING & MODEL REGISTRATION
  # =====================================================
  train-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow scikit-learn pandas pyarrow dvc dagshub boto3

      # 🔑 DVC AUTH (DAGsHub)
      - name: Configure DVC credentials
        run: |
          if [ -z "${{ secrets.DAGSHUB_USER }}" ] || [ -z "${{ secrets.DAGSHUB_TOKEN }}" ]; then
            echo "❌ DAGSHUB secrets missing"
            exit 1
          fi

          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify --local dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull feature data
        run: dvc pull

      # 🔐 MLflow Auth
      - name: Configure MLflow
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Train & register model
        run: python training/train.py

      - name: Verify artifacts
        run: |
          ls -R artifacts
          cat artifacts/run_id.txt

      - name: Promotion gate
        run: python training/promote_model.py

  # =====================================================
  # 2️⃣ INFERENCE SERVICE CI (NO TRAINING)
  # =====================================================
  inference-ci:
    name: Inference Service CI
    runs-on: ubuntu-latest
    needs: train-and-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inference_service/requirements.txt
          pip install mlflow

      - name: Configure MLflow
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/inference_service" >> $GITHUB_ENV

      - name: Import inference app
        run: |
          python - <<EOF
          from app.main import app
          print("✅ Inference app imports correctly")
          EOF

      - name: Load model from MLflow
        run: |
          python - <<EOF
          from app.model_loader import get_model
          model = get_model()
          print("✅ Model loaded:", type(model))
          EOF

      - name: Docker build inference image
        run: |
          docker build \
            -f inference_service/Dockerfile \
            -t security-inference-ci .

  # =====================================================
  # 3️⃣ BUILD & PUSH DOCKER IMAGE (GHCR)
  # =====================================================
  push-inference-image:
    name: Push Inference Image to GHCR
    runs-on: ubuntu-latest
    needs: inference-ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & tag image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/security-inference
          SHA=${{ github.sha }}

          docker build \
            -f inference_service/Dockerfile \
            -t $IMAGE:$SHA \
            -t $IMAGE:staging \
            -t $IMAGE:latest \
            .

      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/security-inference
          docker push --all-tags $IMAGE
