name: MLOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Explicitly install critical libs just in case
          pip install mlflow scikit-learn pandas pyarrow dvc dagshub boto3

      # 🔑 DVC AUTH
      - name: Configure DVC credentials
        run: |
          if [ -z "${{ secrets.DAGSHUB_USER }}" ] || [ -z "${{ secrets.DAGSHUB_TOKEN }}" ]; then
            echo "❌ DAGSHUB secrets are missing"
            exit 1
          fi

          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "${{ secrets.DAGSHUB_USER }}"
          dvc remote modify --local dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      # 📦 DATA
      - name: Pull feature data from DVC
        run: |
          dvc pull

      # 🔐 MLFLOW
      - name: Configure MLflow
        run: |
          echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_USERNAME=${{ secrets.MLFLOW_TRACKING_USERNAME }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.MLFLOW_TRACKING_PASSWORD }}" >> $GITHUB_ENV

      # 🧠 TRAIN (Automatically Registers Model)
      - name: Run training
        run: |
          python training/train.py

      # 🔍 VERIFY
      - name: Verify training artifacts
        run: |
          ls -R artifacts
          cat artifacts/run_id.txt

      # 🚦 PROMOTION (Moves Registered Model -> Staging)
      - name: Promotion gate
        run: |
          python training/promote_model.py