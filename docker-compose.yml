version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: security_mlops_postgres
    environment:
      POSTGRES_USER: mlops_user
      POSTGRES_PASSWORD: mlops_password
      POSTGRES_DB: security_mlops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops_network

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: security_mlops_mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlops_user:mlops_password@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://mlops_user:mlops_password@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - mlops_network

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: security_mlops_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - mlops_network

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: security_mlops_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - mlops_network

  # FastAPI Inference Service
  inference_service:
    build:
      context: ./inference_service
      dockerfile: Dockerfile
    container_name: security_mlops_inference
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_STAGE: Production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://mlops_user:mlops_password@postgres:5432/security_mlops
    depends_on:
      - postgres
      - mlflow
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops_network

  # Airflow Webserver
  airflow_webserver:
    image: apache/airflow:2.8.0
    container_name: security_mlops_airflow_webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://mlops_user:mlops_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_network
    command: webserver

  # Airflow Scheduler
  airflow_scheduler:
    image: apache/airflow:2.8.0
    container_name: security_mlops_airflow_scheduler
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://mlops_user:mlops_password@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops_network
    command: scheduler

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: security_mlops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mlops_network

volumes:
  postgres_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  mlops_network:
    driver: bridge
